[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-network-recovery-toolkit"
version = "0.2.0"
description = "Public mirror: Windows endpoint reliability CLI + fixture-mode demo API"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dashboard = [
    "nicegui>=2.0",
    "psutil>=5.9",
    "pywin32>=306; platform_system=='Windows'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "black>=24.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-python-jose",
    "PyYAML>=6.0",
]

[project.scripts]
wnrt = "windows_network_toolkit.cli:console_main"
wnrt-api = "backend.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "platform_core*",
    "backend*",
    "src*",
    "windows_network_toolkit*",
    "toolkit*",
]
exclude = ["tests*", "frontend*", "scripts*", "docs*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "frontend",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"windows_network_toolkit/distributed_delivery.py" = ["UP042"]

[tool.ruff.lint.isort]
# Private-monorepo packages that are not exported but are still imported by
# windows_network_toolkit/agent/read_only.py and decision/hypothesis_engine.py;
# keep their import grouping identical to the private repo.
known-first-party = ["endpoint_agent", "proxy_reasoning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = [
    "platform_core",
    "src/platform_core",
    "backend",
    "windows_network_toolkit",
]
