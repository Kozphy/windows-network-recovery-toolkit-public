# Public mirror CI — fixture/CLI safety slice only.
name: public-mirror-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check windows_network_toolkit backend/public_app.py tools/export_public_mirror.py tools/public_release_audit.py
      - name: Public release audit
        run: python tools/public_release_audit.py --tracked-only
      - name: Pytest (public slice)
        env:
          PYTHONPATH: ${{ github.workspace }}
          PLATFORM_FIXTURE_MODE: "1"
        run: |
          python -m pytest -q \
            tests/test_policy_safety_contract.py \
            tests/test_api_dry_run_default.py \
            tests/test_public_release_audit.py \
            tests/test_export_public_mirror.py \
            tests/windows_network_toolkit/test_dns_edge.py \
            tests/windows_network_toolkit/test_ipv6_path.py \
            tests/backend/test_api_contract.py
